<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leader Portal — Login</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script src="storage-guard.js"></script>
  <script src="firebase-config.js"></script>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#CA8A04;--navy-dk:#0F1F4D;--navy-md:#CA8A04;--gold:#F5C542;
      --nd:#334155;--nm:#64748B;--sb:#E2E8F0;
      --ur:#dc2626;--urb:#fef2f2;--urbr:#fca5a5;
    }
    body{
      font-family:'Segoe UI',system-ui,sans-serif;color:var(--nd);min-height:100vh;
      background:linear-gradient(180deg,var(--navy-dk) 0%,var(--navy) 55%,var(--navy-md) 100%);
      display:flex;align-items:center;justify-content:center;padding:24px;
    }
    .wrap{width:100%;max-width:440px;text-align:center}

    .emblem{width:90px;height:90px;margin:0 auto 16px;border-radius:50%;display:block}

    .brand{font-size:24px;font-weight:900;color:#fff;letter-spacing:2px}

    .card{background:#fff;border-radius:20px;padding:26px 24px;margin-top:28px;
      box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:left}
    .card-title{font-size:18px;font-weight:700;color:var(--navy);text-align:center}
    .card-sub{font-size:12px;color:var(--nd);text-align:center;margin-top:4px;margin-bottom:18px}

    .err{display:none;background:var(--urb);border:1px solid var(--urbr);border-radius:8px;
      padding:9px 12px;margin-bottom:12px;font-size:12px;font-weight:600;color:var(--ur);
      align-items:center;gap:8px}
    .err.show{display:flex}
    .err svg{width:16px;height:16px;fill:var(--ur);flex-shrink:0}

    .field{margin-bottom:14px}
    .lbl{display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:6px}
    .inp-wrap{position:relative;display:flex;align-items:center}
    .inp-wrap>svg{position:absolute;left:12px;width:17px;height:17px;fill:var(--navy);pointer-events:none}
    input{width:100%;font-family:inherit;font-size:14px;color:var(--nd);
      border:1px solid var(--sb);border-radius:12px;padding:12px 42px 12px 38px;
      outline:none;transition:border-color .15s,box-shadow .15s;background:#fff}
    input:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(202,138,4,.12)}
    .toggle{position:absolute;right:8px;background:none;border:none;cursor:pointer;
      width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .toggle:hover{background:#F1F5F9}
    .toggle svg{width:18px;height:18px;fill:var(--nm);position:static}

    .submit{width:100%;height:50px;background:var(--navy);color:#fff;border:none;
      border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;
      letter-spacing:1px;cursor:pointer;margin-top:8px;transition:opacity .15s}
    .submit:hover{opacity:.9}
    .submit:disabled{opacity:.6;cursor:not-allowed}

    .foot{font-size:12px;font-weight:600;color:#fff;margin-top:26px;text-align:center;
      text-shadow:0 1px 3px rgba(0,0,0,.45)}
    .hint{font-size:11px;font-weight:500;color:rgba(255,255,255,.92);margin-top:8px;
      text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.45)}
  </style>
</head>
<body>
  <div class="wrap">
    <img class="emblem" src="favicon.svg" alt="Leader Portal emblem" />
    <h1 class="brand">LEADER PORTAL</h1>

    <form class="card" id="login-form" autocomplete="off" novalidate>
      <div class="card-title">Leader Authentication</div>
      <div class="card-sub">Sign in to access your administrative dashboard</div>

      <div class="err" id="err">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span id="err-text"></span>
      </div>

      <div class="field">
        <label class="lbl" for="phone">Leader Phone Number</label>
        <div class="inp-wrap">
          <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
          <input id="phone" name="phone" type="tel" inputmode="numeric" placeholder="8978925540" />
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="password">Password</label>
        <div class="inp-wrap">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter password" />
          <button class="toggle" id="toggle" type="button" title="Show password">
            <svg id="eye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z"/></svg>
          </button>
        </div>
      </div>

      <button class="submit" id="submit" type="submit">LOGIN TO DASHBOARD</button>
    </form>

    <p class="foot">Authorized Access Only &bull; Leader Portal Administration</p>
    <p class="hint">Session is stored locally in this browser until you log out.</p>
  </div>

<script>
(function(){
  var SESSION_KEY = "leaderPortalSession";
  var LEADER_COLLECTIONS = ["admin_credentials"]; // admin sign-in records (the only one login reads)

  try {
    if (localStorage.getItem(SESSION_KEY)) { window.location.replace("index.html"); return; }
  } catch(e) {}

  var form    = document.getElementById("login-form");
  var phone   = document.getElementById("phone");
  var pass    = document.getElementById("password");
  var err     = document.getElementById("err");
  var errText = document.getElementById("err-text");
  var submit  = document.getElementById("submit");

  function showErr(msg){ errText.textContent = msg; err.classList.add("show"); }
  function clearErr(){ err.classList.remove("show"); }

  // Keep only digits and drop a leading country/area zero: "91 8978925540"
  // and "08978925540" must match the stored phone number.
  function normPhone(v){
    var d = String(v || "").replace(/[^0-9]/g, "");
    if (d.length === 12 && d.indexOf("91") === 0) d = d.slice(2);
    if (d.length === 11 && d.charAt(0) === "0")   d = d.slice(1);
    return d;
  }

  phone.addEventListener("input", clearErr);
  pass.addEventListener("input", clearErr);

  document.getElementById("toggle").addEventListener("click", function(){
    var showing = pass.type === "text";
    pass.type = showing ? "password" : "text";
    this.title = showing ? "Show password" : "Hide password";
  });

  // ─── Firestore (same dynamic-import pattern as index.html's app.js) ───────
  var fs = null;         // { db, getDoc, doc, collection, query, where, getDocs }

  function initFirestore(){
    if (fs) return Promise.resolve(fs);
    return Promise.all([
      import("https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js")
    ]).then(function(mods){
      var app = mods[0].initializeApp(window.FIREBASE_CONFIG);
      var api = mods[1];
      fs = {
        db:        api.getFirestore(app),
        getDoc:    api.getDoc,
        doc:       api.doc,
        collection: api.collection,
        query:     api.query,
        where:     api.where,
        getDocs:   api.getDocs
      };
      return fs;
    });
  }

  // Normalize one stored user/leader document into a credential record.
  function readCred(d){
    d = d || {};
    return {
      phone:       String(d.phone || d.phoneNumber || d.mobile || "").replace(/[^0-9]/g, ""),
      password:    String(d.password != null ? d.password : (d.pass != null ? d.pass : "")),
      name:        d.name || d.leaderName || d.username || "Leader",
      designation: d.designation || d.role || "Leader / Admin",
      role:        String(d.role || d.userType || ""),
      status:      String(d.status || "")
    };
  }

  function isLeaderRecord(c){
    var r = c.role.toLowerCase();
    return !r || r.indexOf("leader") >= 0;
  }
  function isActiveRecord(c){
    var s = c.status.toLowerCase();
    return !s || s === "active";
  }

  // Look the leader up in Firestore: exact document ids first, then a query
  // on the phone field across the leader credential collections.
  function findLeader(cleanPhone){
    var lookups = [];
    LEADER_COLLECTIONS.forEach(function(col){
      [cleanPhone, "leader_" + cleanPhone].forEach(function(id){
        lookups.push(function(){
          return fs.getDoc(fs.doc(fs.db, col, id)).then(function(s){
            if (!s.exists()) return null;
            var c = readCred(s.data());
            return c.phone === cleanPhone ? c : null;
          });
        });
      });
    });

    function run(i){
      if (i >= lookups.length) return queryByPhone(0);
      return lookups[i]().then(function(found){
        return found || run(i + 1);
      });
    }

    function queryByPhone(ci){
      if (ci >= LEADER_COLLECTIONS.length) return null;
      var q = fs.query(fs.collection(fs.db, LEADER_COLLECTIONS[ci]), fs.where("phone", "==", cleanPhone));
      return fs.getDocs(q).then(function(snap){
        if (snap && snap.size) return readCred(snap.docs[0].data());
        return queryByPhone(ci + 1);
      });
    }

    return run(0);
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    clearErr();

    var cleanPhone = normPhone(phone.value);
    var password   = pass.value;

    if (!cleanPhone) { showErr("Please enter phone number"); phone.focus(); return; }
    if (!password.trim()) { showErr("Please enter password"); pass.focus(); return; }

    submit.disabled = true;
    submit.textContent = "VERIFYING…";

    initFirestore()
      .then(function(){ return findLeader(cleanPhone); })
      .then(function(rec){
        if (!rec) throw new Error("NO_ACCOUNT");
        if (!isLeaderRecord(rec)) throw new Error("NOT_LEADER");
        if (!isActiveRecord(rec)) throw new Error("INACTIVE");
        if (rec.password !== password) throw new Error("BAD_PASSWORD");

        try {
          localStorage.setItem(SESSION_KEY, JSON.stringify({
            phone: rec.phone || cleanPhone,
            name: rec.name,
            designation: rec.designation,
            role: rec.role || "Leader",
            loggedInAt: Date.now()
          }));
        } catch(err) {}

        submit.textContent = "WELCOME, " + String(rec.name).toUpperCase();
        window.location.replace("index.html");
      })
      .catch(function(e){
        console.error("Login failed:", e);
        submit.disabled = false;
        submit.textContent = "LOGIN TO DASHBOARD";
        var m = e && e.message;
        if (m === "NO_ACCOUNT" || m === "BAD_PASSWORD" || m === "NOT_LEADER"){
          showErr("Invalid phone number or password");
        } else if (m === "INACTIVE"){
          showErr("This account is inactive. Contact the administrator.");
        } else {
          showErr("Cannot verify your credentials right now — check your connection and try again.");
        }
      });
  });
})();
</script>
</body>
</html>
